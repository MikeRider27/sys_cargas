name: sys-cargas

services:
  db:
    build: ./db
    image: sys-cargas-db:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargas
      POSTGRES_USER: cargas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: ${TZ:-America/Asuncion}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargas -d cargas"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [backend]

  backend:
    build: ./backend
    image: sys-cargas-backend:2.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/cargas
      DB_USER: cargas
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (32+ caracteres)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-America/Asuncion}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, frontend]

  frontend:
    build: ./frontend
    image: sys-cargas-frontend:2.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8097}:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [frontend]

volumes:
  db-data:

networks:
  backend:
    internal: true
  frontend:
